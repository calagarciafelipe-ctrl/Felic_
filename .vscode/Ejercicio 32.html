<script>
    const carrito = {
    productos: [
        { nombre: "Mouse", precio: 50000 },
        { nombre: "Teclado", precio: 80000 },
        { nombre: "Monitor", precio: 700000 }
    ]
};

let total = 0;

for (const producto of carrito.productos) {
    total += producto.precio;
}

console.log("Total de la compra: $" + total);
</script>
